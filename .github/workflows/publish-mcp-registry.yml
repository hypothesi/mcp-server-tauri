name: Publish to MCP Registry

on:
  workflow_run:
    workflows: ["Release Packages"]
    types:
      - completed

jobs:
  publish-to-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Update server.json version from package.json
        working-directory: packages/mcp-server
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/update-server-json-version.js "$VERSION"

      # Pin mcp-publisher v1.8.1 (linux/amd64). Bump tag, URL, and sha256 together.
      - name: Install mcp-publisher
        working-directory: packages/mcp-server
        env:
          MCP_PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o mcp-publisher.tar.gz "$MCP_PUBLISHER_URL"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          rm -f mcp-publisher.tar.gz

      - name: Authenticate to MCP Registry
        working-directory: packages/mcp-server
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        working-directory: packages/mcp-server
        run: ./mcp-publisher publish
